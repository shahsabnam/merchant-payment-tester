<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Payment Tester — CityBank Gateway</title>
  <meta name="description" content="Internal testing tool for CityBank merchant payment gateway integration">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PGW Tester">
  <link rel="apple-touch-icon" href="icon.svg">
</head>

<body>

  <!-- Animated Background -->
  <div class="bg-animation">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="logo">
      <div class="logo-icon">🏦</div>
      <div class="logo-text"><span>CityBank</span> Payment Tester</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="installAppBtn" type="button" style="display:none;align-items:center;gap:6px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(99,102,241,0.4);transition:transform 0.2s;">
        📲 Install App
      </button>
      <div class="header-badge">
        <div class="dot"></div>
        Testing Environment
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-main">

    <!-- Environment Tabs -->
    <div class="env-tabs">
      <button class="env-tab" data-env="DEV">🛠️ DEV</button>
      <button class="env-tab active" data-env="UAT">🧪 UAT</button>
      <button class="env-tab" data-env="LOCAL">💻 LOCAL</button>
    </div>

    <!-- Step Indicator -->
    <div class="step-indicator">
      <div class="step active" id="step1Indicator">
        <div class="step-number">1</div>
        <span>Generate Token</span>
      </div>
      <div class="step-connector" id="stepConnector"></div>
      <div class="step" id="step2Indicator">
        <div class="step-number">2</div>
        <span>Make Payment</span>
      </div>
    </div>

    <!-- Two-Panel Layout -->
    <div class="panels">

      <!-- PANEL 1: Token Generation -->
      <div class="panel-token">
        <div class="card">
          <div class="card-header">
            <h2><span class="icon">🔑</span> Merchant Authentication</h2>
          </div>
          <div class="card-body">



            <form id="tokenForm">
              <div class="form-group">
                <label for="loginname">Merchant Username <span class="required">*</span></label>
                <input type="text" id="loginname" class="form-input" value="SHARETRIP" placeholder="e.g. SHARETRIP" required
                  autocomplete="off">
              </div>

              <div class="form-group">
                <label for="login_password">Merchant Password <span class="required">*</span></label>
                <input type="password" id="login_password" class="form-input" value="SHTrip#12345678" placeholder="Enter merchant password"
                  required autocomplete="off">
              </div>

              <button type="submit" class="btn btn-primary" id="tokenBtn">
                <span id="tokenBtnText">🔐 Generate Token</span>
              </button>
            </form>

            <!-- Response Box -->
            <div class="response-box" id="responseBox">
              <div class="label">API Response</div>
              <div class="value" id="responseContent"></div>
            </div>

            <!-- Token History -->
            <div class="token-history" id="tokenHistory" style="display:none;">
              <div class="token-history-title">Recent Tokens</div>
              <div id="tokenHistoryList"></div>
            </div>

          </div>
        </div>
      </div>

      <!-- PANEL 2: Payment Form -->
      <div class="panel-payment disabled" id="paymentPanel">
        <div class="card">
          <div class="card-header">
            <h2><span class="icon">💳</span> Payment Details</h2>
          </div>
          <div class="card-body">
            <form id="paymentForm" method="POST">

              <div class="form-group">
                <label for="transactionId">Transaction ID</label>
                <input type="text" id="transactionId" name="transactionId" class="form-input has-value" readonly
                  required>
                <div class="info-tip">
                  <span class="tip-icon">ℹ️</span> Auto-filled from token generation
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="merchanRefNo">Merchant Ref No <span class="required">*</span></label>
                  <input type="text" id="merchanRefNo" name="merchanRefNo" class="form-input" value="DEV" required
                    placeholder="Unique txn identifier">
                </div>
                <div class="form-group">
                  <label for="txnamount">Amount <span class="required">*</span></label>
                  <input type="text" id="txnamount" name="txnamount" class="form-input" value="23" required
                    placeholder="e.g. 100">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="servicetype">Service Type <span class="required">*</span></label>
                  <input type="text" id="servicetype" name="servicetype" class="form-input" value="DARAZ" required
                    placeholder="e.g. DARAZ">
                </div>
                <div class="form-group">
                  <label for="serviceid">Service ID <span class="required">*</span></label>
                  <input type="text" id="serviceid" name="serviceid" class="form-input" value="DARAZ" required
                    placeholder="e.g. DARAZ">
                </div>
              </div>

              <div class="form-group">
                <label for="resendpoint">Response Endpoint (Redirect URL) <span style="font-size: 11px; color: var(--text-muted); font-weight: normal;">(Optional)</span></label>
                <input type="text" id="resendpoint" name="resendpoint" class="form-input"
                  placeholder="Auto-configured to current host /callback">
                <small style="display: block; margin-top: 4px; font-size: 11px; color: var(--text-muted);">
                  📍 This must be <strong>your merchant tester callback URL</strong>.
                </small>
              </div>

              <button type="submit" class="btn btn-success" id="paymentBtn" style="margin-top: 8px;">
                📱 Continue to CityBank Payment
              </button>

            </form>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
      });
    }

    // PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = 'inline-flex';
    });
    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
        }
      });
    }
    window.addEventListener('appinstalled', () => {
      if (installBtn) installBtn.style.display = 'none';
    });
  </script>
</body>

</html>
