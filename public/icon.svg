<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Bank / Pillar Vector Graphic -->
  <g transform="translate(96, 96) scale(0.625)" fill="#ffffff" filter="url(#shadow)">
    <!-- Roof Triangular Pediment -->
    <path d="M 256,40 L 480,160 L 32,160 Z" />
    <!-- Entablature Beam -->
    <rect x="32" y="170" width="448" height="28" rx="6" />
    <!-- 4 Classical Pillars -->
    <rect x="64" y="210" width="56" height="190" rx="8" />
    <rect x="168" y="210" width="56" height="190" rx="8" />
    <rect x="288" y="210" width="56" height="190" rx="8" />
    <rect x="392" y="210" width="56" height="190" rx="8" />
    <!-- Base Platform Stairs -->
    <rect x="32" y="410" width="448" height="30" rx="6" />
    <rect x="16" y="446" width="480" height="34" rx="8" />
  </g>
</svg>
